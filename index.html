    <script type="application/javascript">
      // Override XMLHttpRequest to disable credentials for copilot requests
      (function () {
        const OriginalXHR = window.XMLHttpRequest;

        window.XMLHttpRequest = function () {
          const xhr = new OriginalXHR();
          const originalOpen = xhr.open;

          xhr.open = function (method, url, ...args) {
            if (url && url.includes("copilot.live")) {
              xhr.withCredentials = false;
            }
            return originalOpen.apply(this, [method, url, ...args]);
          };

          return xhr;
        };
      })();

      // Load Copilot script
      (function (w, d, s, o, f) {
        w[o] =
          w[o] ||
          function () {
            (w[o].q = w[o].q || []).push(arguments);
          };

        const js = d.createElement(s);
        const fjs = d.getElementsByTagName(s)[0];

        js.id = o;
        js.src = f;
        js.async = true;
        js.referrerPolicy = "no-referrer";

        fjs.parentNode.insertBefore(js, fjs);
      })(
        window,
        document,
        "script",
        "copilot",
        "https://script.copilot.live/v1/copilot.min.js?tkn=cat-yi7nknkt"
      );

      // Error handling
      window.addEventListener("error", function (e) {
        if (e.message && e.message.includes("copilot")) {
          console.warn("Copilot error handled:", e.message);
          e.preventDefault();
        }
      });

      // Initialize Copilot
      copilot("init", {});
    </script>
